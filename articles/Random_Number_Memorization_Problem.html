<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="随机抽题工具：从Excel题库中随机抽取1-300号的题目，并支持查看答案">
    <title>随机抽题器 - 小h的背包</title>
    
    <!-- SheetJS 解析 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: url('../images/Probability/Probability_Chapter_background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .article-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            margin-bottom: 25px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .back-link::before {
            content: '←';
            margin-right: 8px;
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .back-link:hover::before {
            transform: translateX(-3px);
        }

        .back-link::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .back-link:active::after {
            width: 100px;
            height: 100px;
        }

        /* 烟花容器 */
        #fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            animation: firework-animation 1.5s ease-out forwards;
        }

        @keyframes firework-animation {
            0% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 1;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1);
                opacity: 0;
            }
        }

        .article-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.2em;
            text-align: center;
        }
        
        .article-meta {
            color: #7f8c8d;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }
        
        .article-content {
            font-size: 1.1em;
            line-height: 1.8;
        }
        
        .article-content h2 {
            color: #2c3e50;
            margin: 30px 0 15px 0;
            font-size: 1.6em;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }
        
        /* 随机数&抽题卡片 */
        .randomizer-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 30px 20px;
            margin: 30px 0;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .range-badge {
            display: inline-block;
            background: #667eea20;
            color: #667eea;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        
        .random-number {
            font-size: 4rem;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e293b, #3b82f6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 15px 0;
        }
        
        .generate-btn {
            background: #667eea;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3);
            margin: 10px 0 20px;
        }
        
        .generate-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        
        /* 文件上传区域 */
        .file-area {
            background: #f1f5f9;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        .file-label {
            font-weight: 600;
            color: #2c3e50;
            display: block;
            margin-bottom: 8px;
        }
        .file-input {
            margin: 5px 0;
        }
        .status-msg {
            font-size: 0.85rem;
            color: #2c5e2e;
            margin-top: 8px;
        }
        
        /* 题目展示区域 */
        .question-panel {
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0 15px;
            text-align: left;
            border-left: 5px solid #667eea;
        }
        .question-text {
            font-weight: 500;
            color: #1e293b;
            margin-bottom: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .answer-btn {
            background: #34a853;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        .answer-btn:hover {
            background: #2c8e46;
        }
        .answer-display {
            background: #eef2ff;
            border-radius: 16px;
            padding: 15px;
            margin-top: 15px;
            color: #1e3a8a;
            font-size: 0.95rem;
            display: none;
        }
        .answer-display.show {
            display: block;
        }
        
        .info-text {
            background: #eef2ff;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.9rem;
            color: #2c3e50;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="article-card">
        <a href="../index.html" class="back-link">返回首页</a>
        
        <div class="article-header">
            <h1>📚 背题神器！ · 1~300 题库</h1>
            <div class="article-meta">
                发布日期: 2026-04-22 | 分类: About Math | 作者: 小h
            </div>
        </div>
        
        <div class="article-content">
            <p>请先上传您的 Excel 题库文件（含序号、题目、补充信息、答案），之后每次生成随机数，系统会自动展示对应的题目，并支持查看答案。</p>
            
            <!-- 文件上传区 -->
            <div class="file-area">
                <div class="file-label">📂 选择 Excel 题库文件（.xls 或 .xlsx）</div>
                <input type="file" id="excelUpload" accept=".xls, .xlsx, .csv" class="file-input">
                <div id="uploadStatus" class="status-msg">⚡ 未加载题库，请上传文件</div>
            </div>
            
            <!-- 随机抽题核心 -->
            <div class="randomizer-card">
                <div class="range-badge">🎲 随机序号 · 1 ～ 300</div>
                <div class="random-number" id="randomValue">—</div>
                <button class="generate-btn" id="rollBtn">✨ 随机抽题</button>
                
                <!-- 题目与答案区域 -->
                <div id="questionPanel" class="question-panel" style="display: none;">
                    <div class="question-text" id="questionText">题目将显示在这里</div>
                    <button class="answer-btn" id="showAnswerBtn">📖 查看答案</button>
                    <div id="answerDisplay" class="answer-display"></div>
                </div>
                
                <div class="info-text">
                    💡 表格要求：第一列序号(1-300)，第二列题目，第三列补充信息(可空)，第四列答案。<br>
                    🧠 每次抽题后，点击「查看答案」按钮显示正确答案。
                </div>
            </div>
        </div>
    </div>
</div>

<div id="fireworks-container"></div>

<script>
    // ---------- 全局题库存储 ----------
    let questionMap = new Map();   // key: 序号(数字), value: { question, extra, answer }
    let isLoaded = false;
    
    // DOM 元素
    const fileInput = document.getElementById('excelUpload');
    const uploadStatus = document.getElementById('uploadStatus');
    const randomValueSpan = document.getElementById('randomValue');
    const rollBtn = document.getElementById('rollBtn');
    const questionPanel = document.getElementById('questionPanel');
    const questionTextDiv = document.getElementById('questionText');
    const showAnswerBtn = document.getElementById('showAnswerBtn');
    const answerDisplayDiv = document.getElementById('answerDisplay');
    
    // ---------- 解析 Excel 文件 ----------
    function parseExcel(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: "" });
            
            if (!rows || rows.length < 2) {
                uploadStatus.innerHTML = "❌ 文件为空或格式错误，请确保有表头和数据行";
                uploadStatus.style.color = "#c00";
                return;
            }
            
            // 假设第一行是表头，从第二行开始读取
            // 列索引: 0->序号, 1->题目, 2->补充, 3->答案
            questionMap.clear();
            let validCount = 0;
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 2) continue;
                const id = Number(row[0]);
                if (isNaN(id) || id < 1 || id > 300) continue; // 只接受1-300序号
                const question = row[1] ? String(row[1]).trim() : "";
                const extra = row[2] ? String(row[2]).trim() : "";
                const answer = row[3] ? String(row[3]).trim() : "";
                if (question === "") continue; // 题目不能为空
                
                questionMap.set(id, {
                    question: question,
                    extra: extra,
                    answer: answer || "（无答案）"
                });
                validCount++;
            }
            
            if (validCount === 0) {
                uploadStatus.innerHTML = "❌ 未找到有效数据，请检查列顺序（序号|题目|补充|答案）";
                uploadStatus.style.color = "#c00";
                isLoaded = false;
            } else {
                uploadStatus.innerHTML = `✅ 加载成功！共导入 ${validCount} 道题（序号1~300）`;
                uploadStatus.style.color = "#2c5e2e";
                isLoaded = true;
                // 清空之前的题目显示
                questionPanel.style.display = "none";
                randomValueSpan.textContent = "—";
            }
        };
        reader.onerror = function() {
            uploadStatus.innerHTML = "❌ 文件读取失败，请重试";
            uploadStatus.style.color = "#c00";
            isLoaded = false;
        };
        reader.readAsArrayBuffer(file);
    }
    
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        parseExcel(file);
    });
    
    // ---------- 随机数生成 + 显示题目 ----------
    function getRandomInt() {
        return Math.floor(Math.random() * 300) + 1;
    }
    
    function displayQuestionByNumber(num) {
        if (!isLoaded) {
            alert("请先上传题库文件！");
            return false;
        }
        const data = questionMap.get(num);
        if (!data) {
            questionTextDiv.innerHTML = `⚠️ 序号 ${num} 在题库中不存在，请检查表格是否包含该序号。`;
            showAnswerBtn.style.display = "none";
            answerDisplayDiv.classList.remove("show");
            answerDisplayDiv.innerHTML = "";
            questionPanel.style.display = "block";
            return false;
        }
        
        // 拼接题目内容（第二列 + 第三列）
        let fullQuestion = data.question;
        if (data.extra && data.extra !== "") {
            fullQuestion += "\n" + data.extra;
        }
        questionTextDiv.innerHTML = fullQuestion;
        // 存储答案供按钮调用
        questionPanel.setAttribute("data-current-answer", data.answer);
        showAnswerBtn.style.display = "inline-block";
        answerDisplayDiv.classList.remove("show");
        answerDisplayDiv.innerHTML = "";
        questionPanel.style.display = "block";
        return true;
    }
    
    function generateAndShow() {
        if (!isLoaded) {
            alert("请先上传 Excel 题库文件（含序号、题目、答案）");
            return;
        }
        const randNum = getRandomInt();
        randomValueSpan.textContent = randNum;
        displayQuestionByNumber(randNum);
        // 简单的动画反馈
        randomValueSpan.style.transform = 'scale(1.05)';
        setTimeout(() => { randomValueSpan.style.transform = 'scale(1)'; }, 150);
    }
    
    // 答案按钮逻辑
    showAnswerBtn.addEventListener('click', function() {
        const answer = questionPanel.getAttribute("data-current-answer");
        if (answer) {
            answerDisplayDiv.innerHTML = `<strong>📌 答案：</strong><br>${answer}`;
            answerDisplayDiv.classList.add("show");
        } else {
            answerDisplayDiv.innerHTML = "暂无答案";
            answerDisplayDiv.classList.add("show");
        }
    });
    
    rollBtn.addEventListener('click', generateAndShow);
    
    // 初始随机数（未加载时不显示题目）
    randomValueSpan.textContent = "?";
    
    // ---------- 返回按钮烟花特效 ----------
    function createFireworks(x, y) {
        const container = document.getElementById('fireworks-container');
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffa500', '#ff69b4'];
        const particleCount = 80;
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'firework';
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 100;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            particle.style.backgroundColor = color;
            particle.style.setProperty('--x', '0px');
            particle.style.setProperty('--y', '0px');
            particle.style.setProperty('--tx', tx + 'px');
            particle.style.setProperty('--ty', ty + 'px');
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.animationDelay = (Math.random() * 0.5) + 's';
            container.appendChild(particle);
            setTimeout(() => {
                if (particle.parentNode) particle.parentNode.removeChild(particle);
            }, 1500);
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        const backLink = document.querySelector('.back-link');
        if (backLink) {
            backLink.addEventListener('click', function(e) {
                e.preventDefault();
                backLink.textContent = '跳转中...';
                backLink.style.pointerEvents = 'none';
                const rect = backLink.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                createFireworks(x, y);
                setTimeout(() => { window.location.href = backLink.href; }, 800);
            });
        }
    });
</script>
</body>
</html>
