<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎打开小h的背包</title>
    
    <!-- CSS文件引入 -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/navigation.css">
    <link rel="stylesheet" href="css/components/articles.css">
</head>

<body>
    <div class="container">
        <div class="card">
            <!-- 头像 - 确保图片在 images/avatar.jpg -->
            <img src="images/avatar.jpg" alt="小h的头像" class="avatar">
            
            <h1>Hello! There is the bag of xiaoH.👋</h1>
            <p class="title">IT | 前端开发</p>
            
            <div class="intro">
                <h2>About 小h</h2>
                <p>欢迎来到小h的背包, 这里收藏了小h的所有法宝和魔法书</p>
                
                <h3>My skills</h3>
                <div class="skills">
                    <span class="skill-tag">HTML/CSS</span>
                    <span class="skill-tag">JavaScript</span>
                    <span class="skill-tag">Git</span>
                    <span class="skill-tag">Python</span>
                    <span class="skill-tag">高代助教</span>
                    <span class="skill-tag">数分</span>
                    <span class="skill-tag">程设</span>
                    <span class="skill-tag">计组</span>
                </div>
            </div>
            
            <div class="contact">
                <h3>Contact me</h3>
                <p>
                    📧 <a href="mailto:your-email@example.com">671312329@qq.com</a><br>
                    💻 <a href="https://github.com/ZhouH-671" target="_blank">GitHub</a>
                </p>
            </div>

            <!-- 文章栏目部分 -->
            <section class="articles-section">
                <div class="container">
                    <h1>My Blog</h1>
        
                    <!-- 文章分类导航 -->
                    <div class="categories">
                        <button class="category-btn active" data-category="all">All</button>
                        <button class="category-btn" data-category="tech">About JavaScript</button>
                        <button class="category-btn" data-category="life">Daliy life</button>
                        <button class="category-btn" data-category="learning">About Math</button>
                    </div>

                    <!-- 数学分类的子类 默认隐藏 -->
                    <div class="subcategories hidden" id="math-subcategories">
                        <div class="subcategories-inner">
                            <button class="subcategory-btn" data-category="Linear-Algebra">Linear Algebra</button>
                            <button class="subcategory-btn" data-category="math-analysis">Math analysis</button>
                            <button class="subcategory-btn" data-category="Discrete-Mathematics">Discrete Mathematics</button>
                            <button class="subcategory-btn" data-category="Probability-Statistics">Probability & Statistics</button>
                        </div>
                    </div>
        
                    <!-- 文章列表容器 -->
                    <div class="articles-container">
                        <div class="articles-list" id="all-articles">
                            <!-- 全部文章会显示在这里 -->
                            <div class="no-articles">
                                <p>📝 还没有发布文章，敬请期待！</p>
                            </div>
                        </div>
                    </div>
            
                    <div class="articles-list hidden" id="tech-articles">
                        <!-- 技术分享类文章 -->
                        <div class="no-articles">
                            <p>💻 技术分享分类还没有文章</p>
                        </div>
                    </div>
            
                    <div class="articles-list hidden" id="life-articles">
                        <!-- 生活随笔类文章 -->
                        <div class="no-articles">
                            <p>🌿 生活随笔分类还没有文章</p>
                        </div>
                    </div>
            
                    <div class="articles-list hidden" id="learning-articles">
                        <!-- 学习笔记类文章 -->
                        <div class="no-articles">
                            <p>📖 学习笔记分类还没有文章</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- 引入外部JavaScript文件 -->
    <script src="js/blog.js">
    </script>
</body>
</html>
